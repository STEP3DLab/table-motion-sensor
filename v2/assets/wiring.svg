<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 480"><rect width="920" height="480" fill="#f5f7fc"/><g font-family="Arial" fill="#142447" font-size="17"><rect x="30" y="30" width="190" height="415" rx="10" fill="#082567"/><g fill="white"><text x="50" y="73" font-size="24">Arduino Uno</text><text x="50" y="109">USB-B ← питание 5 В</text><text x="62" y="175">A4 / A5 / 5V / GND</text><text x="62" y="260">D3, D4, D5, D6</text><text x="62" y="360">D9</text></g><g fill="none" stroke="#426ab4" stroke-width="3"><path d="M220 170h75M220 254h75M220 355h75"/></g><text x="310" y="163" font-weight="bold">AMP-B041</text><text x="310" y="188">A4 → D (SDA), A5 → C (SCL), 5V → V, GND → G</text><text x="310" y="246" font-weight="bold">Светодиоды × 4</text><text x="310" y="273">Каждый вывод → свой резистор 330 Ом → анод; катод → GND</text><text x="310" y="340" font-weight="bold">Активная пищалка 5 В</text><text x="310" y="367">D9 → 1 кОм → база NPN; база → 10 кОм → GND</text><text x="310" y="393">Эмиттер → GND; коллектор → минус пищалки; плюс → 5V</text><text x="310" y="419">Диод параллельно пищалке: полоска к 5V.</text></g></svg>
